<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ethan Shirley">
    <meta name="description" content="A simple, user-friendly product review form to rate items, share feedback, and submit installation details.">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product…</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <label>
                    <input type="radio" name="rating" value="1" required>
                    1
                </label>

                <label>
                    <input type="radio" name="rating" value="2">
                    2
                </label>

                <label>
                    <input type="radio" name="rating" value="3">
                    3
                </label>

                <label>
                    <input type="radio" name="rating" value="4">
                    4
                </label>

                <label>
                    <input type="radio" name="rating" value="5">
                    5
                </label>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features (check all that apply)</legend>

                <label>
                    <input type="checkbox" name="features" value="durability">
                    Durability
                </label>

                <label>
                    <input type="checkbox" name="features" value="ease-of-use">
                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" name="features" value="performance">
                    Performance
                </label>

                <label>
                    <input type="checkbox" name="features" value="design">
                    Design
                </label>

                <label>
                    <input type="checkbox" name="features" value="value">
                    Value for Money
                </label>
            </fieldset>

            <label for="writtenReview">Written Review (optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

            <label for="userName">Your Name (optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> &#10070; Ethan Shirley &#10070; California</p>
        <div class="lastModified">
            <p>Last Modified: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>
</html>
